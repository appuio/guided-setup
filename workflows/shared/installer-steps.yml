spells:
- match: And I download the `openshift-install` binary for version "(?P<ocp_version>[^"]+)"
  description: |-
    This step downloads the `openshift-install` binary for the specified OpenShift version.
  outputs:
  - name: openshift_install_bin

  run: |
    set -euo pipefail

    openshift-install() {
      ./openshift-install "${@}"
    }

    if [[ -f openshift-install ]]
    then
      echo "Found existing openshift-install binary, checking version ..."
      INSTALLED_VERSION=$(openshift-install version | sed -E -n '/openshift-install/s/^[^ ]+ v?//;s/\.[0-9]{1,2}$//p')
      if [ "$INSTALLED_VERSION" = "$MATCH_ocp_version" ]; then
        echo "✅ openshift-install version ${MATCH_ocp_version}.XX is present."
        env -i "openshift_install_bin=$( pwd )/openshift-install" >> "$OUTPUT"
        exit 0
      else
        echo "⚠️ openshift-install version $INSTALLED_VERSION is present, but version $MATCH_ocp_version is required. Deleting local binary and installing $MATCH_ocp_version"
        rm openshift-install
      fi
    fi

    rm -f openshift-install-linux.tar.gz
    echo -n "Determining latest patch version for ${MATCH_ocp_version} ... "
    ocp_graph=$(curl -fsSL "https://api.openshift.com/api/upgrades_info/v1/graph?channel=stable-${MATCH_ocp_version}&arch=amd64")
    latest_version=$(jq -n -r --argjson g "$ocp_graph" --arg minor "${MATCH_ocp_version}" \
      '[ $g.nodes[] | select(.version | test($minor)) | .version ]
       | map(split(".") | map(tonumber))
       | max | join(".")')
    echo "${latest_version}"

    echo -n "Determining latest patch version which can be upgraded to ${latest_version} ... "
    prev_version=$(jq -n -r --argjson g "$ocp_graph" --arg latest "$latest_version" \
      '$g.nodes
       | to_entries[]
       | select(.value.version==$latest)
       | .key as $curr_index
       | [
         $g.edges[]
         | select(.[1]==$curr_index)
         | $g.nodes[.[0]].version
         | split(".") | map(tonumber)
       ] | max | join(".")')
    echo "${prev_version}"

    echo "Downloading openshift-install for version ${prev_version} ..."
    curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/${prev_version}/openshift-install-linux.tar.gz"
    tar -xf openshift-install-linux.tar.gz openshift-install
    ./openshift-install version

    env -i "openshift_install_bin=$( pwd )/openshift-install" >> "$OUTPUT"
