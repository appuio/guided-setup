spells:
- match: And I download the `openshift-install` binary for version "(?P<ocp_version>[^"]+)"
  description: |-
    This step downloads the `openshift-install` binary for the specified OpenShift version.
  outputs:
  - name: openshift_install_bin

  run: |
    set -euo pipefail

    openshift-install() {
      ./openshift-install "${@}"
    }

    if [[ -f openshift-install ]]
    then
      echo "Found existing openshift-install binary, checking version ..."
      INSTALLED_VERSION=$(openshift-install version | sed -E -n '/openshift-install/s/^[^ ]+ v?//;s/\.[0-9]{1,2}$//p')
      if [ "$INSTALLED_VERSION" = "$MATCH_ocp_version" ]; then
        echo "✅ openshift-install version ${MATCH_ocp_version}.XX is present."
        env -i "openshift_install_bin=$( pwd )/openshift-install" >> "$OUTPUT"
        exit 0
      else
        echo "⚠️ openshift-install version $INSTALLED_VERSION is present, but version $MATCH_ocp_version is required. Deleting local binary and installing $MATCH_ocp_version"
        rm openshift-install
      fi
    fi

    case "$(uname -s)" in
      Darwin) installer_os=mac ;;
      *) installer_os=linux ;;
    esac

    rm -f "openshift-install-${installer_os}.tar.gz"
    echo -n "Determining latest patch version for ${MATCH_ocp_version} ... "
    # NOTE(sg): The OpenShift channel graph API returns a JSON object with the
    # following shape:
    #
    # {
    #   nodes: [
    #     {
    #       version: "MAJOR.MINOR.PATCH",
    #       ...
    #     },
    #     ...
    #   ],
    #   edges: [
    #     [from_index, to_index],
    #     ...
    #   ],
    #   ...
    # }
    #
    # where from_index and to_index for each edges entry are indices into the
    # `nodes` list. Each entry of `edges` represents a possible upgrade path.
    ocp_graph=$(curl -fsSL "https://api.openshift.com/api/upgrades_info/v1/graph?channel=stable-${MATCH_ocp_version}&arch=amd64")
    # This jq query filters the nodes list by our target minor version, splits
    # the version field (so it will be sorted numerically for `max`) and joins
    # the result of max with dots to return the latest patch version that's
    # available on the stable channel.
    latest_version=$(jq -n -r --argjson g "$ocp_graph" --arg minor "${MATCH_ocp_version}" \
      '[ $g.nodes[] | select(.version | test($minor)) | .version ]
       | map(split(".") | map(tonumber))
       | max | join(".")')
    echo "${latest_version}"

    echo -n "Determining latest patch version which can be upgraded to ${latest_version} ... "
    # This jq query takes the latest patch version that's available on the
    # stable channel and finds the index of that patch version's entry in the
    # nodes list. Afterwards the query finds all edges which point to the
    # latest patch version, extracts the version of edge's origin, and returns
    # the highest patch version that has an upgrade edge to the latest patch
    # version.
    prev_version=$(jq -n -r --argjson g "$ocp_graph" --arg latest "$latest_version" \
      '$g.nodes
       | to_entries[]
       | select(.value.version==$latest)
       | .key as $curr_index
       | [
         $g.edges[]
         | select(.[1]==$curr_index)
         | $g.nodes[.[0]].version
         | split(".") | map(tonumber)
       ] | max | join(".")')
    echo "${prev_version}"

    echo "Downloading openshift-install for version ${prev_version} ..."
    curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/${prev_version}/openshift-install-${installer_os}.tar.gz"
    tar -xf "openshift-install-${installer_os}.tar.gz" openshift-install
    ./openshift-install version

    env -i "openshift_install_bin=$( pwd )/openshift-install" >> "$OUTPUT"
