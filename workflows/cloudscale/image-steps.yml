spells:
- match: And I set up required S3 buckets
  description: |-
    This step sets up the required S3 buckets for the OpenShift cluster installation.

    It uses the MinIO Client (`mc`) to create the necessary buckets if they do not already exist.
  inputs:
  - name: cloudscale_token
  - name: commodore_cluster_id
  - name: csp_region
  outputs:
  - name: bucket_user
    type: sensitive
  run: |
    set -euo pipefail

    response=$(curl -sH "Authorization: Bearer ${INPUT_cloudscale_token}" \
      https://api.cloudscale.ch/v1/objects-users | \
      jq -e ".[] | select(.display_name == \"${INPUT_commodore_cluster_id}\")" ||:)
    if [ -z "$response" ]; then
      echo "Creating Cloudscale S3 user for cluster ID '${INPUT_commodore_cluster_id}'..."
      response=$(curl -sH "Authorization: Bearer ${INPUT_cloudscale_token}" \
        -F display_name=${INPUT_commodore_cluster_id} \
        https://api.cloudscale.ch/v1/objects-users)
      echo "Created user with id $(echo "$response" | jq -r .id)"
    else
      echo "Cloudscale S3 user for cluster ID '${INPUT_commodore_cluster_id}' already exists. id: $(echo "$response" | jq -r .id)"
    fi

    echo -n "Waiting for S3 credentials to become available ..."
    until mc alias set \
      "${INPUT_commodore_cluster_id}" "https://objects.${INPUT_csp_region}.cloudscale.ch" \
      "$(echo "$response" | jq -r '.keys[0].access_key')" \
      "$(echo "$response" | jq -r '.keys[0].secret_key')"
    do
      echo -n .
      sleep 5
    done
    echo "OK"

    mc mb --ignore-existing \
      "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-bootstrap-ignition"
    mc mb --ignore-existing \
      "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-image-registry"
    mc mb --ignore-existing \
      "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-logstore"

    keyid=$(mc alias list ${INPUT_commodore_cluster_id} -json | jq -r .accessKey)
    export AWS_ACCESS_KEY_ID="${keyid}"
    secretkey=$(mc alias list ${INPUT_commodore_cluster_id} -json | jq -r .secretKey)
    export AWS_SECRET_ACCESS_KEY="${secretkey}"

    echo "Configuring S3 bucket policies..."
    aws s3api put-public-access-block \
      --endpoint-url "https://objects.${INPUT_csp_region}.cloudscale.ch" \
      --bucket "${INPUT_commodore_cluster_id}-image-registry" \
      --public-access-block-configuration BlockPublicAcls=false
    aws s3api put-bucket-lifecycle-configuration \
      --endpoint-url "https://objects.${INPUT_csp_region}.cloudscale.ch" \
      --bucket "${INPUT_commodore_cluster_id}-image-registry" \
      --lifecycle-configuration '{
        "Rules": [
          {
            "ID": "cleanup-incomplete-multipart-registry-uploads",
            "Prefix": "",
            "Status": "Enabled",
            "AbortIncompleteMultipartUpload": {
              "DaysAfterInitiation": 1
            }
          }
        ]
      }'
    echo "S3 buckets are set up."

    env -i "bucket_user=$(echo "$response" | jq -c .)" >> "$OUTPUT"

- match: And I import the image in Cloudscale
  description: |-
    This step uploads the Red Hat CoreOS image to the S3 bucket for the image registry.

    It then imports the image into Cloudscale as a custom image.

    It uses the MinIO Client (`mc`) to perform the upload.
  inputs:
  - name: image_path
  - name: commodore_cluster_id
  - name: csp_region
  - name: bucket_user
  - name: image_major
  - name: image_minor
  - name: cloudscale_token
  run: |
    set -euo pipefail


    auth_header="Authorization: Bearer ${INPUT_cloudscale_token}"
    image_slug="rhcos-${INPUT_image_major}.${INPUT_image_minor}"

    target_zones=$(jq -n -r --arg zone "${INPUT_csp_region}1" '[$zone]')
    # NOTE(sg): The value of zones is a space-separated list of zones where
    # the image with the given slug exists or the empty string if the image
    # doesn't exist in any zone.
    images_resp=$(curl -fsSL -H "$auth_header" https://api.cloudscale.ch/v1/custom-images)
    zones=$(jq -n -r --argjson resp "$images_resp" --arg slug "$image_slug" \
      '$resp[] | select(.slug == $slug) | [.zones[]|.slug]|join(" ")')
    old_image_href=
    if [ -n "$zones" ] && [[ "$zones" == *"${INPUT_csp_region}1"* ]]; then
      echo "✅ Image '$image_slug' already exists in cloudscale zone ${INPUT_csp_region}, skipping upload."
      exit 0
    elif [ -n "$zones" ]; then
      echo "Image '$image_slug' already exists in cloudscale zone(s) '${zones}', configuring multi-zone image upload"
      old_image_href=$(jq -n -r --argjson resp "$images_resp" --arg slug "$image_slug" \
        '$resp[] |select(.slug == $slug) | .href')
      target_zones=$(jq -n -r --argjson zones "$target_zones" \
        --arg zone "$INPUT_csp_region}1" '$zones + [$zone]')
    fi

    mc alias set \
      "${INPUT_commodore_cluster_id}" "https://objects.${INPUT_csp_region}.cloudscale.ch" \
      "$(echo "$INPUT_bucket_user" | jq -r '.keys[0].access_key')" \
      "$(echo "$INPUT_bucket_user" | jq -r '.keys[0].secret_key')"

    echo "Uploading Red Hat CoreOS image '$INPUT_image_path' to S3 bucket '${INPUT_commodore_cluster_id}-image-registry'..."
    mc cp "rhcos-${INPUT_image_major}.${INPUT_image_minor}.qcow2" "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-bootstrap-ignition/"

    echo "Upload completed."
    mc anonymous set download "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-bootstrap-ignition/rhcos-${INPUT_image_major}.${INPUT_image_minor}.qcow2"

    echo "Importing image into Cloudscale..."

    import_req=$(jq -n -r \
      --argjson zones "$target_zones" \
      --argjson image_download "$(mc share download --json "${INPUT_commodore_cluster_id}/${INPUT_commodore_cluster_id}-bootstrap-ignition/rhcos-${INPUT_image_major}.${INPUT_image_minor}.qcow2")" \
      --arg name "RHCOS ${INPUT_image_major}.${INPUT_image_minor}" \
      --arg image_slug "$image_slug" \
      '{
        "slug": $image_slug,
        "url": $image_download.url,
        "name": $name,
        "zones": $zones,
        "source_format": "raw",
        "user_data_handling": "pass-through"
      }')


    import_resp=$(curl -fsSL -H "$auth_header" \
      https://api.cloudscale.ch/v1/custom-images/import \
      --json "$import_req")

    echo "Waiting for import to complete..."
    import_id=$(jq -n -r --argjson import "$import_resp" '$import.uuid')
    import_done=false
    status="initializing"
    step_exit=0
    while ! $import_done; do
      import_status_resp=$(curl -fsSL -H "$auth_header" \
        "https://api.cloudscale.ch/v1/custom-images/import/${import_id}")
      status=$(jq -n -r --argjson status "$import_status_resp" '$status.status')
      case "$status" in
        "started"|"in_progress")
          echo -n "."
          import_done=false
          import_error=
          ;;
        "failed")
          import_done=true
          import_error="❌ $(jq -n -r --argjson status "$import_status_resp" '$status.error_message')"
          step_exit=1
          break
          ;;
        "success")
          import_done=true
          import_error=
          break
          ;;
        *)
          import_done=true
          import_error="⚠️ Unknown import status '${status}', canceling wait for completion, please verify the import status manually!"
          step_exit=0
          break
          ;;
      esac
      sleep 5
    done
    echo ""

    echo "Import completed with status ${status}"
    if [ -n "$import_error" ]; then
      echo -e "\n$import_error"
      exit "$step_exit"
    else
      echo -e "\n✅ Successfully imported image"
    fi
    sleep 0.1
