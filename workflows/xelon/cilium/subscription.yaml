apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: clife
  namespace: cilium
spec:
  channel: '1.18'
  config:
    env:
      - name: KUBERNETES_SERVICE_HOST
        value: ${API_INT}
      - name: KUBERNETES_SERVICE_PORT
        value: '6443'
    resources:
      limits:
        cpu: 100m
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 250Mi
  installPlanApproval: Manual
  name: clife
  source: certified-operators
  sourceNamespace: openshift-marketplace
